<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./stylesheet/index.css">
    <title>Restaurant Order Form</title>
    <style>
        /* Additional custom styles */
        body {
            padding-top: 56px;
        }
        .nav-bar {
            background-color: #343a40;
        }
        .nav-bar ul {
            list-style: none;
            padding: 0;
        }
        .nav-bar li {
            display: inline;
        }
        .nav-bar a {
            color: white;
            padding: 10px 15px;
            display: inline-block;
            text-decoration: none;
        }
        .nav-bar a:hover {
            background-color: #495057;
        }
        .title {
            margin: 20px 0;
        }
        .order-form {
            margin-top: 20px;
        }
        .menu-section, .delivery-section {
            margin-bottom: 20px;
        }
        .highlight-link {
            font-weight: bold;
            font-size: 1.2rem;
            background-color: #ffc107;
            color: #343a40 !important;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a class="navbar-brand" href="#">Roster's Kitchen</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link highlight-link" href="./order-status.html">Check Your Order</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="title text-center">Roster's Kitchen Order Form</h1>
        
        <form id="orderForm" class="order-form">
            <div class="menu-section">
                <h2>Menu</h2>
                <div id="menuContainer" class="menu-container"></div>
                
                <h2>Extras</h2>
                <div id="extrasContainer" class="menu-container"></div>
            </div>

            <div class="delivery-section form-group form-check">
                <input type="checkbox" class="form-check-input" id="deliveryGru" name="deliveryGru">
                <label class="form-check-label" for="deliveryGru">Delivery on GRU Campus (K5)</label>
                <br>
                <input type="checkbox" class="form-check-input" id="deliveryOutsideGru" name="deliveryOutsideGru">
                <label class="form-check-label" for="deliveryOutsideGru">Delivery outside GRU Campus (K22)</label>
            </div>

            <div class="form-group">
                <button type="button" onclick="proceedToCheckout()" class="btn btn-primary">Proceed to Checkout</button>
            </div>
        </form>
    </div>

    <script src="./index.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
