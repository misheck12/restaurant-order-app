<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin Panel</title>
    <style>
        /* Custom CSS can still be used if needed */
        body {
            padding-top: 56px;
        }
        header {
            background-color: #343a40;
            color: white;
            padding: 10px 0;
        }
        .menu-section, .extras-section, .orders-section {
            margin-bottom: 20px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a class="navbar-brand" href="#">Admin Panel</a>
        <button class="btn btn-danger ml-auto" onclick="logout()">Logout</button>
    </nav>
    <div class="container-fluid">
        <main class="mt-3">
            <div class="row">
                <div class="col-lg-4 col-md-6 col-sm-12 mb-3">
                    <section class="menu-section bg-light p-3 rounded shadow-sm">
                        <h2>Menu</h2>
                        <form id="menuForm">
                            <div class="form-group">
                                <label for="itemName">Item Name:</label>
                                <input type="text" class="form-control" id="itemName" name="itemName" required>
                            </div>
                            <div class="form-group">
                                <label for="itemPrice">Item Price (K):</label>
                                <input type="number" class="form-control" id="itemPrice" name="itemPrice" required>
                            </div>
                            <div class="form-group">
                                <button type="button" class="btn btn-primary" onclick="addItem()">Add Item</button>
                            </div>
                        </form>
                        <div id="menuList" class="item-list mt-3">
                            <!-- Dynamically filled with menu items -->
                        </div>
                    </section>
                </div>
                <div class="col-lg-4 col-md-6 col-sm-12 mb-3">
                    <section class="extras-section bg-light p-3 rounded shadow-sm">
                        <h2>Extras</h2>
                        <form id="extrasForm">
                            <div class="form-group">
                                <label for="extraName">Extra Name:</label>
                                <input type="text" class="form-control" id="extraName" name="extraName" required>
                            </div>
                            <div class="form-group">
                                <label for="extraPrice">Extra Price (K):</label>
                                <input type="number" class="form-control" id="extraPrice" name="extraPrice" required>
                            </div>
                            <div class="form-group">
                                <label for="extraCategory">Category:</label>
                                <select class="form-control" id="extraCategory" name="extraCategory" required>
                                    <option value="breakfast">Breakfast</option>
                                    <option value="lunch">Lunch</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <button type="button" class="btn btn-primary" onclick="addExtra()">Add Extra</button>
                            </div>
                        </form>
                        <div id="extrasList" class="item-list mt-3">
                            <!-- Dynamically filled with extra items -->
                        </div>
                    </section>
                </div>
                <div class="col-lg-4 col-md-12 col-sm-12 mb-3">
                    <section class="orders-section bg-light p-3 rounded shadow-sm">
                        <h2>Orders</h2>
                        <div class="order-category mt-3" id="pendingOrders">
                            <h3>Pending Orders</h3>
                            <div class="table-responsive">
                                <table class="table table-bordered">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>Order Number</th>
                                            <th>Name</th>
                                            <th>Items</th>
                                            <th>Total (K)</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="pendingOrderList">
                                        <!-- Dynamically filled with pending orders -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="order-category mt-3" id="preparingOrders">
                            <h3>Preparing Orders</h3>
                            <div class="table-responsive">
                                <table class="table table-bordered">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>Order Number</th>
                                            <th>Name</th>
                                            <th>Total (K)</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="preparingOrderList">
                                        <!-- Dynamically filled with preparing orders -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="order-category mt-3" id="readyOrders">
                            <h3>Ready Orders</h3>
                            <div class="table-responsive">
                                <table class="table table-bordered">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>Order Number</th>
                                            <th>Name</th>
                                            <th>Total (K)</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="readyOrderList">
                                        <!-- Dynamically filled with ready orders -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="order-category mt-3" id="completedOrders">
                            <h3>Completed Orders</h3>
                            <div class="table-responsive">
                                <table class="table table-bordered">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>Order Number</th>
                                            <th>Name</th>
                                            <th>Total (K)</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="completedOrderList">
                                        <!-- Dynamically filled with completed orders -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="./admin.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
