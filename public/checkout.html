<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Checkout</title>
    <style>
        body {
            background-color: #f8f9fa; /* Light background color */
        }
        .checkout-container {
            max-width: 700px; /* Adjusting max-width for readability */
            margin: 30px auto; /* Centering the container */
            background-color: #fff; /* White background */
            padding: 30px; /* Padding for content spacing */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
            border-radius: 10px; /* Rounded corners */
        }
        .payment-options {
            margin-top: 30px; /* Margin for separation */
        }
        .withdrawal-info {
            margin-top: 10px; /* Margin between elements */
            font-size: 0.9rem; /* Slightly smaller font */
        }
        .submit-button {
            display: block; /* Full width button */
            width: 100%;
            border-radius: 25px; /* Rounded button */
            margin-top: 20px; /* Margin for spacing */
        }
        .order-summary, .total {
            text-align: center; /* Centered text */
        }
        header.header {
            background-color: #007bff; /* Blue background for header */
            color: white; /* White text for contrast */
            padding: 10px 0; /* Padding for spacing */
            border-radius: 10px 10px 0 0; /* Rounded top corners */
            margin-bottom: -10px; /* Overlap margin to blend with container */
        }
        header.header h1 {
            margin: 0; /* Remove default margin */
        }
        .order-number {
            text-align: center; /* Centered text */
            font-size: 1.5rem; /* Larger font size */
            font-weight: bold; /* Bold text */
            color: #007bff; /* Matching the header color */
            margin-bottom: 20px; /* Space below */
        }
        .order-item {
            border-bottom: 1px solid #dee2e6;
            padding: 10px 0;
        }
        .order-item:last-child {
            border-bottom: none;
        }
        .total-cost {
            margin-top: 20px;
            font-size: 1.25rem;
            font-weight: bold;
        }        .form-check-label {
            font-size: 1.1rem;
            color: #495057;
        }
        .order-type {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
        .discount {
            color: #28a745;
            font-weight: bold;
        }
        #deliveryAddress {
            position: relative;
        }
        .pac-container {
            z-index: 1051 !important;
        }
        #addressError {
            font-size: 0.875rem;
        }

        /* Responsive Design */
        @media (max-width: 767.98px) {
            .checkout-container {
                margin: 20px 10px; /* Reduce margin for smaller screens */
                padding: 20px; /* Reduce padding for smaller screens */
            }
            .header {
                padding: 10px; /* Adjust padding for smaller screens */
            }
            .header h1 {
                font-size: 1.5rem; /* Reduce font size for smaller screens */
            }
            .order-number {
                font-size: 1.2rem; /* Adjust font size for smaller screens */
                margin-bottom: 15px; /* Adjust margin for smaller screens */
            }
            .total-cost {
                font-size: 1rem; /* Adjust font size for smaller screens */
                margin-top: 15px; /* Adjust margin for smaller screens */
            }
            .withdrawal-info {
                font-size: 0.85rem; /* Adjust font size for smaller screens */
            }
        }
        @media (max-width: 575.98px) {
            .checkout-container {
                margin: 10px 5px; /* Further reduce margin for extra small screens */
                padding: 15px; /* Further reduce padding for extra small screens */
            }
            .header h1 {
                font-size: 1.25rem; /* Further reduce font size for extra small screens */
            }
            .order-number {
                font-size: 1rem; /* Further adjust font size for extra small screens */
            }
            .total-cost {
                font-size: 0.9rem; /* Further adjust font size for extra small screens */
            }
            .withdrawal-info {
                font-size: 0.8rem; /* Further adjust font size for extra small screens */
            }
        }
    </style>
</head>
<body>
    <header class="header text-center">
        <h1>Checkout</h1>
    </header>
    <div class="checkout-container">
        <div class="order-number" id="orderNumber"></div> <!-- Order number here -->
        <div class="checkout-content">
            <div id="orderSummary" class="order-summary"></div>
            <div class="payment-options">
                <h3>Payment Options</h3>
                <div class="form-group">
                    <label for="paymentMethod">Select Payment Method:</label>
                    <select id="paymentMethod" name="paymentMethod" class="form-control" required>
                        <option value="cash">Cash</option>
                        <option value="airtel">Airtel Money</option>
                        <option value="mtn">MTN Money</option>
                    </select>
                </div>
                <div class="form-group" id="transactionIdGroup" style="display: none;">
                    <label for="transactionId">Transaction ID:</label>
                    <input type="text" id="transactionId" name="transactionId" class="form-control">
                </div>
                <div class="withdrawal-info">
                    <p>For mobile money withdrawals:</p>
                    <ul>
                        <li>0979535773 (Airtel Money - Eudora Kambone)</li>
                        <li>0964360493 (MTN Money - Nancy Mukupo)</li>
                    </ul>
                </div>
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>                <div class="form-group">
                    <label for="phoneNumber">Mobile Number:</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" required>
                </div>
                <div class="form-group" id="deliveryAddressGroup" style="display: none;">
                    <label for="deliveryAddress">Delivery Address:</label>
                    <input type="text" id="deliveryAddress" name="deliveryAddress" class="form-control" placeholder="Start typing your address...">
                    <small class="form-text text-muted">Type your address and select from the suggestions for accurate delivery.</small>
                    <div id="addressError" class="text-danger mt-2" style="display: none;"></div>
                </div>
                <div class="form-group" id="deliveryNotesGroup" style="display: none;">
                    <label for="deliveryNotes">Delivery Notes (Optional):</label>
                    <textarea id="deliveryNotes" name="deliveryNotes" class="form-control" rows="2" placeholder="Any special instructions for delivery..."></textarea>
                </div>
            </div>
            <div class="form-group text-center">
                <button type="button" onclick="submitOrder()" class="btn btn-primary submit-button">Submit Order</button>
            </div>
            <div class="total-cost" id="totalCost"></div>
        </div>
    </div>    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_PLACES_API_KEY&libraries=places"></script>
    <script>
        let autocomplete;
        let selectedAddress = null;

        document.addEventListener('DOMContentLoaded', () => {
            const order = JSON.parse(localStorage.getItem('order'));
            displayOrder(order);
            initializeAddressAutocomplete();

            const paymentMethodSelect = document.getElementById('paymentMethod');
            paymentMethodSelect.addEventListener('change', handlePaymentMethodChange);
        });

        function initializeAddressAutocomplete() {
            const addressInput = document.getElementById('deliveryAddress');
            
            // Check if Google Places API is available
            if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
                console.warn('Google Places API not available. Address autocomplete will be disabled.');
                return;
            }

            autocomplete = new google.maps.places.Autocomplete(addressInput, {
                types: ['address'],
                componentRestrictions: { country: 'zm' } // Restrict to Zambia
            });

            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                if (!place.geometry) {
                    document.getElementById('addressError').textContent = 'Please select a valid address from the suggestions.';
                    document.getElementById('addressError').style.display = 'block';
                    selectedAddress = null;
                } else {
                    document.getElementById('addressError').style.display = 'none';
                    selectedAddress = {
                        formatted_address: place.formatted_address,
                        place_id: place.place_id,
                        geometry: {
                            lat: place.geometry.location.lat(),
                            lng: place.geometry.location.lng()
                        }
                    };
                }
            });
        }        function displayOrder(order) {
            if (!order) {
                document.getElementById('orderSummary').innerText = 'No order found.';
                return;
            }

            // Show/hide delivery address fields based on order type
            const deliveryAddressGroup = document.getElementById('deliveryAddressGroup');
            const deliveryNotesGroup = document.getElementById('deliveryNotesGroup');
            
            if (order.delivery) {
                deliveryAddressGroup.style.display = 'block';
                deliveryNotesGroup.style.display = 'block';
                document.getElementById('deliveryAddress').required = true;
            } else {
                deliveryAddressGroup.style.display = 'none';
                deliveryNotesGroup.style.display = 'none';
                document.getElementById('deliveryAddress').required = false;
            }

            const orderSummary = document.getElementById('orderSummary');
            const itemsList = order.items.map(item => `
                <div class="order-item">
                    <span>${item.name} (K${item.price.toFixed(2)} each): ${item.quantity}</span>
                </div>
            `).join('');

            const serviceFee = 2; // Example service fee
            const deliveryFee = order.deliveryFee || 0; // Use provided delivery fee if available

            let totalItemsCost = order.items.reduce((sum, item) => sum + item.price * item.quantity, 0);
            
            // Apply discount if available
            let discount = 0;
            if (order.discount && order.discount.amount > 0) {
                discount = order.discount.amount;
            }
            
            const subtotalAfterDiscount = totalItemsCost - discount;
            const total = subtotalAfterDiscount + serviceFee + deliveryFee;

            let discountHtml = '';
            if (discount > 0) {
                discountHtml = `<div class="discount">Discount (${order.discount.code}): -K${discount.toFixed(2)}</div>`;
            }

            orderSummary.innerHTML = `
                <h2>Order Summary</h2>
                <div class="order-type">
                    <strong>Order Type: ${order.delivery ? 'Delivery' : 'Pickup'}</strong>
                </div>
                ${itemsList}
                <div class="order-total">Subtotal: K${totalItemsCost.toFixed(2)}</div>
                ${discountHtml}
                <div class="service-fee">Service Fee: K${serviceFee.toFixed(2)}</div>
                ${order.delivery ? `<div class="delivery-fee">Delivery Fee: K${deliveryFee.toFixed(2)}</div>` : ''}
                <div class="total-with-fees"><strong>Total: K${total.toFixed(2)}</strong></div>
            `;

            document.getElementById('totalCost').innerText = `Total Cost: K${total.toFixed(2)}`;
        }

        function handlePaymentMethodChange() {
            const paymentMethod = document.getElementById('paymentMethod').value;
            const transactionIdGroup = document.getElementById('transactionIdGroup');

            if (paymentMethod === 'airtel' || paymentMethod === 'mtn') {
                transactionIdGroup.style.display = 'block';
                document.getElementById('transactionId').required = true;
            } else {
                transactionIdGroup.style.display = 'none';
                document.getElementById('transactionId').required = false;
            }
        }        async function submitOrder() {
            const order = JSON.parse(localStorage.getItem('order'));
            if (!order) {
                alert('No order found. Please go back and place an order.');
                return;
            }

            // Basic form validation
            const name = document.getElementById('name').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const paymentMethod = document.getElementById('paymentMethod').value;
            const transactionId = document.getElementById('transactionId').value.trim();

            if (!name || !phoneNumber) {
                alert('Please fill in all required fields.');
                return;
            }

            if ((paymentMethod === 'airtel' || paymentMethod === 'mtn') && !transactionId) {
                alert('Please provide the transaction ID for the selected payment method.');
                return;
            }

            // Validate delivery address if delivery is selected
            if (order.delivery) {
                const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
                if (!deliveryAddress) {
                    alert('Please enter a delivery address.');
                    return;
                }
                
                if (!selectedAddress && typeof google !== 'undefined') {
                    alert('Please select a valid address from the suggestions.');
                    return;
                }
            }

            // Prepare order data
            order.paymentMethod = paymentMethod;
            order.transactionId = transactionId || null;
            order.name = name;
            order.phoneNumber = phoneNumber;
            order.status = 'pending';

            // Add delivery information if applicable
            if (order.delivery) {
                order.deliveryAddress = {
                    address: document.getElementById('deliveryAddress').value.trim(),
                    notes: document.getElementById('deliveryNotes').value.trim() || null,
                    coordinates: selectedAddress ? selectedAddress.geometry : null,
                    placeId: selectedAddress ? selectedAddress.place_id : null
                };
            }

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(order)
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    document.getElementById('orderNumber').innerText = `Order Number: ${result.orderNumber}`;
                    localStorage.removeItem('order');
                    
                    // Show success message
                    alert(`Order submitted successfully! Your order number is ${result.orderNumber}. You will be redirected to the order status page.`);
                    
                    setTimeout(() => {
                        window.location.href = './order-status.html';
                    }, 3000);
                } else {
                    document.getElementById('orderNumber').innerText = result.message || 'Failed to submit order. Please try again.';
                    alert(result.message || 'Failed to submit order. Please try again.');
                }
            } catch (error) {
                console.error('Error submitting order:', error);
                document.getElementById('orderNumber').innerText = 'Failed to submit order. Please try again.';
                alert('Network error. Please check your connection and try again.');
            }
        }
    </script>
</body>
</html>
