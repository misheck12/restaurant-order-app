<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Checkout</title>
    <style>
        body {
            background-color: #f8f9fa; /* Light background color */
        }
        .checkout-container {
            max-width: 700px; /* Adjusting max-width for readability */
            margin: 30px auto; /* Centering the container */
            background-color: #fff; /* White background */
            padding: 30px; /* Padding for content spacing */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
            border-radius: 10px; /* Rounded corners */
        }
        .payment-options {
            margin-top: 30px; /* Margin for separation */
        }
        .withdrawal-info {
            margin-top: 10px; /* Margin between elements */
            font-size: 0.9rem; /* Slightly smaller font */
        }
        .submit-button {
            display: block; /* Full width button */
            width: 100%;
            border-radius: 25px; /* Rounded button */
            margin-top: 20px; /* Margin for spacing */
        }
        .order-summary, .total {
            text-align: center; /* Centered text */
        }
        header.header {
            background-color: #007bff; /* Blue background for header */
            color: white; /* White text for contrast */
            padding: 10px 0; /* Padding for spacing */
            border-radius: 10px 10px 0 0; /* Rounded top corners */
            margin-bottom: -10px; /* Overlap margin to blend with container */
        }
        header.header h1 {
            margin: 0; /* Remove default margin */
        }
        .order-number {
            text-align: center; /* Centered text */
            font-size: 1.5rem; /* Larger font size */
            font-weight: bold; /* Bold text */
            color: #007bff; /* Matching the header color */
            margin-bottom: 20px; /* Space below */
        }
        .order-item {
            border-bottom: 1px solid #dee2e6;
            padding: 10px 0;
        }
        .order-item:last-child {
            border-bottom: none;
        }
        .total-cost {
            margin-top: 20px;
            font-size: 1.25rem;
            font-weight: bold;
        }
        .form-check-label {
            font-size: 1.1rem;
            color: #495057;
        }
    </style>
</head>
<body>
    <header class="header text-center">
        <h1>Checkout</h1>
    </header>
    <div class="checkout-container">
        <div class="order-number" id="orderNumber"></div> <!-- Order number here -->
        <div class="checkout-content">
            <div id="orderSummary" class="order-summary"></div>
            <div class="payment-options">
                <h3>Payment Options</h3>
                <div class="form-group">
                    <label for="paymentMethod">Select Payment Method:</label>
                    <select id="paymentMethod" name="paymentMethod" class="form-control" required>
                        <option value="cash">Cash</option>
                        <option value="airtel">Airtel Money</option>
                        <option value="mtn">MTN Money</option>
                    </select>
                </div>
                <div class="form-group" id="transactionIdGroup" style="display: none;">
                    <label for="transactionId">Transaction ID:</label>
                    <input type="text" id="transactionId" name="transactionId" class="form-control">
                </div>
                <div class="withdrawal-info">
                    <p>For mobile money withdrawals:</p>
                    <ul>
                        <li>0979535773 (Airtel Money - Eudora Kambone)</li>
                        <li>0964360493 (MTN Money - Nancy Mukupo)</li>
                    </ul>
                </div>
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Mobile Number:</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" required>
                </div>
            </div>
            <div class="form-group text-center">
                <button type="button" onclick="submitOrder()" class="btn btn-primary submit-button">Submit Order</button>
            </div>
            <div class="total-cost" id="totalCost"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const order = JSON.parse(localStorage.getItem('order'));
            displayOrder(order);

            const paymentMethodSelect = document.getElementById('paymentMethod');
            paymentMethodSelect.addEventListener('change', handlePaymentMethodChange);
        });

        function displayOrder(order) {
            if (!order) {
                document.getElementById('orderSummary').innerText = 'No order found.';
                return;
            }

            const orderSummary = document.getElementById('orderSummary');
            const itemsList = order.items.map(item => `
                <div class="order-item">
                    <span>${item.name} (K${item.price.toFixed(2)} each): ${item.quantity}</span>
                </div>
            `).join('');

            const serviceFee = 2; // Example service fee
            const deliveryFee = order.deliveryFee || 0; // Use provided delivery fee if available

            let totalItemsCost = order.items.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const total = totalItemsCost + serviceFee + deliveryFee;

            orderSummary.innerHTML = `
                <h2>Order Summary</h2>
                ${itemsList}
                <div class="order-total">Total: K${totalItemsCost.toFixed(2)}</div>
                <div class="service-fee">Service Fee: K${serviceFee.toFixed(2)}</div>
                ${order.delivery ? `<div class="delivery-fee">Delivery Fee: K${deliveryFee.toFixed(2)}</div>` : ''}
                <div class="total-with-fees">Total with Fees: K${total.toFixed(2)}</div>
            `;

            document.getElementById('totalCost').innerText = `Total Cost: K${total.toFixed(2)}`;
        }

        function handlePaymentMethodChange() {
            const paymentMethod = document.getElementById('paymentMethod').value;
            const transactionIdGroup = document.getElementById('transactionIdGroup');

            if (paymentMethod === 'airtel' || paymentMethod === 'mtn') {
                transactionIdGroup.style.display = 'block';
                document.getElementById('transactionId').required = true;
            } else {
                transactionIdGroup.style.display = 'none';
                document.getElementById('transactionId').required = false;
            }
        }

        async function submitOrder() {
            const order = JSON.parse(localStorage.getItem('order'));
            if (!order) {
                alert('No order found. Please go back and place an order.');
                return;
            }

            order.paymentMethod = document.getElementById('paymentMethod').value;
            order.transactionId = document.getElementById('transactionId').value || null; // Set to null if not applicable
            order.name = document.getElementById('name').value;
            order.phoneNumber = document.getElementById('phoneNumber').value;
            order.status = 'pending';

            if ((order.paymentMethod === 'airtel' || order.paymentMethod === 'mtn') && !order.transactionId) {
                alert('Please provide the transaction ID for the selected payment method.');
                return;
            }

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(order)
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    document.getElementById('orderNumber').innerText = `Order Number: ${result.orderNumber}`;
                    localStorage.removeItem('order');
                    setTimeout(() => {
                        window.location.href = './order-status.html';
                    }, 8000);
                } else {
                    document.getElementById('orderNumber').innerText = 'Failed to submit order. Please try again.';
                }
            } catch (error) {
                console.error('Error submitting order:', error);
                document.getElementById('orderNumber').innerText = 'Failed to submit order. Please try again.';
            }
        }
    </script>
</body>
</html>
